# Parliament — multi-agent deliberation configuration.
#
# Each [neurotypes.*] table defines one agent. The five canonical roles below
# are required by the DeliberationEngine. Models are looked up via the
# configured provider (default: Ollama at http://localhost:11434).
#
# Override the active provider with the PARLIAMENT_PROVIDER environment
# variable: ollama (default), lm_studio, or omlx.

[parliament]
# Maximum number of deliberation rounds before the engine forces termination.
max_rounds = 5
# Synthesizer confidence threshold (0–1) for declaring consensus.
confidence_threshold = 0.7
# Inject the RedAgent every N rounds to disrupt premature convergence.
red_agent_interval = 2
# Toggle the OSI (Opinion Shift Index) echo-loop detector.
osi_enabled = true
# Jaccard similarity threshold above which an agent is considered to be echoing
# itself across rounds. 0.85 ≈ the canonical OSI_CONVERGENCE_THRESHOLD (0.15
# distance) calibrated against the AlgoDynLab corpus in src/osi.ts.
osi_threshold = 0.85
# Port for the Parliament REST server (`@parliament/server`).
server_port = 3000
# Default provider for all neurotypes: ollama | lm_studio | omlx
# Override per-neurotype with a provider = "..." field.
# oMLX base URL is read from OMLX_BASE_URL env var (default: http://localhost:8080/v1).

[neurotypes.proposer]
model = "gemma-4-31b-it-8bit"
provider = "omlx"
system_prompt = "You are a structured reasoner. Propose a clear, well-reasoned initial response to the topic. Stay within 200 words."

[neurotypes.skeptic]
model = "Qwen3.5-35B-A3B-8bit"
provider = "omlx"
system_prompt = "You are a rigorous critic. Identify logical leaps, unsupported assumptions, and potential errors in the previous response. Stay within 200 words."

[neurotypes.synthesizer]
model = "MLX-Qwen3.5-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-8bit"
provider = "omlx"
system_prompt = """You are a synthesizer. Attempt to reconcile conflicting positions into a more robust unified view, acknowledging what remains unresolved.

You MUST output ONLY a single JSON object with no surrounding prose, no markdown fences, and no commentary. The JSON object MUST conform to this exact schema:

{"summary": "<one-paragraph synthesis, max 200 words>", "confidence": <number in [0,1]>, "consensus": <true|false>, "agreed": ["<short bullet, max 10 words>", ...], "unresolved": ["<short bullet, max 10 words>", ...]}

Field semantics:
- summary: a single paragraph reconciling the debate so far.
- confidence: your calibrated certainty in the synthesis, 0.0 (no confidence) to 1.0 (fully confident).
- consensus: true ONLY if you judge the debate has genuinely resolved into a unified view; false otherwise. Do not set true just because confidence is high.
- agreed: short bullet strings (max ~10 words each) capturing the points the agents agree on.
- unresolved: short bullet strings (max ~10 words each) capturing what remains unresolved.

Output ONLY the JSON object. No preamble, no markdown, no trailing commentary."""

[neurotypes.redAgent]
model = "Qwen3.5-35B-A3B-8bit"
provider = "omlx"
system_prompt = "You are a disruptor. Inject a challenging perspective that prevents premature consensus. Target the weakest assumption in the current debate. Stay within 200 words."

[neurotypes.sentry]
model = "gemma-4-31b-it-8bit"
provider = "omlx"
system_prompt = "You are a monitor. Identify if the current debate shows signs of echo (agents agreeing without genuine synthesis) or uncertainty collapse. Return only: OK, SPECIALIST_NEEDED, or COLLAPSE_DETECTED."
