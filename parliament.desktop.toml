# ---------------------------------------------------------------------------
# [brainstorm] — optional overrides for brainstorm / brainstorm-forge mode.
# Uncomment and edit any subset; omitted keys fall back to in-code defaults.
# ---------------------------------------------------------------------------
#
# [brainstorm]
# # Number of ideas each divergent author produces (default 5, max 20).
# ideas_per_author = 5
#
# # Lineup overrides — each key strict-replaces the default list / model.
# # lineup.divergentAuthors = [
# #   "anthropic/claude-opus-4-6",
# #   "google/gemini-2.5-pro",
# #   "openai/gpt-5",
# #   "deepseek/deepseek-v4-flash",
# # ]
# # lineup.judges = [
# #   "anthropic/claude-sonnet-4-6",
# #   "openai/gpt-5",
# # ]
# # lineup.cluster = "anthropic/claude-opus-4-6"
# # lineup.forgeElaborator = "anthropic/claude-opus-4-6"
#
# # Per-criterion ranking weights. Partial-replace on defaults; auto-normalized
# # to sum=1.0 at run time. Values must be finite and non-negative.
# [brainstorm.rank.weights]
# novelty      = 0.25
# feasibility  = 0.25
# fit          = 0.25
# evidence     = 0.25
#
# # Forge phase: number of top-K ideas to elaborate (default 3, max 10).
# # Only consulted when mode = 'brainstorm/forge'.
# [brainstorm.forge]
# k = 3
