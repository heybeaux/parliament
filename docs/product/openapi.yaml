openapi: 3.1.0
info:
  title: Parliament Developer API
  version: 1.0.0
  summary: Multi-agent deliberation as a service.
  description: |
    The Parliament Developer API exposes deliberation primitives as HTTP endpoints.
    Submit a topic, choose a topology preset, get back a structured transcript with
    per-turn cost, residue score, and (optionally) a synthesized resolution.

    This OpenAPI 3.1 document is the source of truth for SDK generation, dashboard
    playgrounds, and the public docs site at docs.parliament.app. It mirrors the
    prose specification in `docs/product/API.md` 1:1.

    **Design principles (locked in PRD D2):**
      - Error-forwarding by default. Upstream errors surface verbatim with provider
        context preserved in `error.upstream`.
      - Transcripts are first-class — every turn, agent, model, and cost is retrievable.
      - Streaming is canonical via Server-Sent Events; polling is the fallback.
      - Idempotency is supported on every POST via `Idempotency-Key` (UUID, 24h scope).
      - Self-host parity: OSS server implements identical routes under identical shapes.
  contact:
    name: Parliament API support
    url: https://docs.parliament.app
    email: support@parliament.app
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://parliament.app/terms

servers:
  - url: https://api.parliament.app/v1
    description: Hosted production
  - url: http://localhost:3000/v1
    description: Self-host default

security:
  - bearerAuth: []

tags:
  - name: Presets
    description: Topology preset discovery.
  - name: Deliberations
    description: Lifecycle and inspection of deliberations.
  - name: Usage
    description: Account usage and quota state.
  - name: Health
    description: Service health (public, no auth).

paths:
  /presets:
    get:
      operationId: listPresets
      tags: [Presets]
      summary: List available deliberation presets.
      description: |
        Returns the catalog of topology presets configured for the account.
        Presets with non-empty `missing_neurotypes` exist but cannot be invoked —
        `POST /deliberations` against them returns `422 preset_unavailable`.
      responses:
        '200':
          description: Preset catalog
          headers:
            X-RateLimit-Tier: { $ref: '#/components/headers/X-RateLimit-Tier' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/X-RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresetCatalog' }
              examples:
                default:
                  $ref: '#/components/examples/PresetCatalogExample'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /deliberations:
    post:
      operationId: createDeliberation
      tags: [Deliberations]
      summary: Kick off a new deliberation.
      description: |
        Returns immediately (`202 Accepted`) with a deliberation ID. Clients then
        either poll `GET /deliberations/{id}` or stream from
        `GET /deliberations/{id}/stream`.

        Submit `Idempotency-Key` to make replays safe — the same key + body returns
        the original response within a 24h window. Different body with the same key
        returns `409 idempotency_conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliberationRequest' }
            examples:
              minimal:
                summary: Minimal request (only `topic`)
                value:
                  topic: Should we adopt event sourcing for our user service?
              full:
                summary: Full request with context and sources
                value:
                  topic: Should we adopt event sourcing for our user service?
                  preset: socratic
                  context: |
                    We're a 12-person engineering team running a Node + Postgres stack.
                    Current write throughput is 200 RPS; projected 2,000 RPS in 18 months.
                    Compliance requirements include audit trail of every user state change.
                  sources:
                    - title: Martin Fowler on Event Sourcing
                      url: https://martinfowler.com/eaaDev/EventSourcing.html
                      excerpt: Event sourcing ensures that all changes to application state...
                  config:
                    max_rounds: 5
                    confidence_threshold: 0.85
                    max_source_words: 800
                  transform:
                    structured_output: false
                    retry_on_upstream_500: false
      responses:
        '202':
          description: Deliberation accepted; will execute asynchronously.
          headers:
            X-RateLimit-Tier: { $ref: '#/components/headers/X-RateLimit-Tier' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            X-RateLimit-Concurrency-Current: { $ref: '#/components/headers/X-RateLimit-Concurrency-Current' }
            Location:
              description: URL to poll for status.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliberationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamProviderError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

    get:
      operationId: listDeliberations
      tags: [Deliberations]
      summary: List deliberations for the authenticated account.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque pagination cursor returned by a prior call.
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/DeliberationStatus' }
        - in: query
          name: preset
          schema: { type: string }
        - in: query
          name: created_after
          schema: { type: string, format: date-time }
        - in: query
          name: created_before
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated deliberation list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliberationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /deliberations/{id}:
    parameters:
      - $ref: '#/components/parameters/DeliberationId'
    get:
      operationId: getDeliberation
      tags: [Deliberations]
      summary: Retrieve a deliberation's current state.
      description: |
        Safe to call at any frequency (no cost). Returns full transcript, cost
        breakdown, and synthesis once `status` is terminal.
      responses:
        '200':
          description: Current deliberation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliberation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelDeliberation
      tags: [Deliberations]
      summary: Cancel an in-flight deliberation.
      description: |
        Cancels a deliberation that has not yet reached a terminal state. Already-completed
        deliberations cannot be deleted via API in v1 — use the dashboard. v1.5 adds
        retention-based deletion.
      responses:
        '200':
          description: Cancellation acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Deliberation is in a terminal state and cannot be cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /deliberations/{id}/stream:
    parameters:
      - $ref: '#/components/parameters/DeliberationId'
    get:
      operationId: streamDeliberation
      tags: [Deliberations]
      summary: Server-Sent Events stream of a deliberation in flight.
      description: |
        Connection holds open until `status` is terminal. Reconnections that include
        `Last-Event-ID` replay events from that point.

        Event types: `turn`, `event`, `status`, `cost`, `error`, `done`.
      parameters:
        - in: header
          name: Last-Event-ID
          schema: { type: string }
          description: Resume from this event ID after a dropped connection.
      responses:
        '200':
          description: SSE stream.
          headers:
            Content-Type:
              schema: { type: string, enum: ['text/event-stream'] }
            Cache-Control:
              schema: { type: string, enum: ['no-cache'] }
            Connection:
              schema: { type: string, enum: ['keep-alive'] }
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events payload. Each event has shape:
                    event: <type>
                    id: <event-id>
                    data: <json>

                  Event payload schemas (one of):
                    - StreamTurnEvent
                    - StreamSystemEvent
                    - StreamStatusEvent
                    - StreamCostEvent
                    - StreamErrorEvent
                    - StreamDoneEvent
              examples:
                wireFormat:
                  summary: Example wire format
                  value: |
                    event: turn
                    id: evt_001
                    data: {"id":"del_8257...","round":1,"agent":"Translator","role":"translator","model":"mistralai/mistral-large-2512","content":"The load-bearing assumption..."}

                    event: cost
                    id: evt_002
                    data: {"total_usd":0.0028}

                    event: status
                    id: evt_099
                    data: {"status":"completed","resolved":true,"residue_score":0.18}

                    event: done
                    id: evt_100
                    data: {"id":"del_8257..."}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /usage:
    get:
      operationId: getUsage
      tags: [Usage]
      summary: Current-period usage for the authenticated account.
      responses:
        '200':
          description: Usage summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health check.
      description: Public — no authentication required. Returns 200 if the service is operational.
      security: []
      responses:
        '200':
          description: Service operational.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Service degraded or down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pk_<env>_<random>
      description: |
        Bearer token issued via the dashboard. Two key types:
          - `pk_test_…` routes to the sandbox lineup (cheap models, rate-limited
            10/min, doesn't count against usage envelope).
          - `pk_live_…` counts against the tier's deliberation envelope and uses
            the lineup configured for the account's tier.

  parameters:
    DeliberationId:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^del_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Deliberation ID returned by `POST /deliberations`.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        format: uuid
      description: |
        UUID scoped per account, 24h retention. Replays return the original response.
        Reusing a key with a different body returns `409 idempotency_conflict`.

  headers:
    X-RateLimit-Tier:
      schema: { type: string, enum: [free, pro, team, enterprise] }
      description: Account tier.
    X-RateLimit-Period:
      schema: { type: string, enum: [30d] }
      description: Billing period for the limit.
    X-RateLimit-Limit:
      schema: { type: integer }
      description: Deliberations allowed in the current period.
    X-RateLimit-Remaining:
      schema: { type: integer }
      description: Deliberations remaining in the current period.
    X-RateLimit-Reset:
      schema: { type: string, format: date-time }
      description: When the current period resets.
    X-RateLimit-Concurrency-Limit:
      schema: { type: integer }
      description: Max concurrent in-flight deliberations.
    X-RateLimit-Concurrency-Current:
      schema: { type: integer }
      description: Current in-flight deliberations.

  schemas:
    PresetCatalog:
      type: object
      required: [presets, default_preset]
      properties:
        presets:
          type: array
          items: { $ref: '#/components/schemas/Preset' }
        default_preset:
          type: string

    Preset:
      type: object
      required: [id, name, description, best_for, agent_count, missing_neurotypes]
      properties:
        id:
          type: string
          examples: [debate, adversarial, socratic, chain-of-verifiers, star-chamber, long-view, reframe, jury]
        name: { type: string }
        description: { type: string }
        best_for: { type: string }
        agent_count: { type: integer, minimum: 1 }
        missing_neurotypes:
          type: array
          items: { type: string }
          description: |
            Neurotypes required by the preset but not configured for this account.
            If non-empty, the preset cannot be invoked — POST returns 422.

    CreateDeliberationRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 2000
          description: The question for the panel.
        preset:
          type: string
          description: Preset ID. Defaults to `default_preset` from `/presets`.
        context:
          type: string
          maxLength: 8000
          description: Prose context prepended to every non-Sentry agent's prompt.
        sources:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Source' }
        config: { $ref: '#/components/schemas/DeliberationConfig' }
        transform: { $ref: '#/components/schemas/TransformFlags' }

    Source:
      type: object
      required: [title, url]
      properties:
        title: { type: string, maxLength: 300 }
        url: { type: string, format: uri }
        excerpt: { type: string, maxLength: 4000 }

    DeliberationConfig:
      type: object
      properties:
        max_rounds:
          type: integer
          minimum: 1
          maximum: 10
          description: Override default rounds. Tier-capped (Pro≤5, Team≤7, Enterprise≤10).
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Early-exit threshold for synthesis confidence.
        max_source_words:
          type: integer
          minimum: 100
          maximum: 4000
          description: Truncation cap applied to each source's `excerpt`.

    TransformFlags:
      type: object
      description: |
        Opt-in transformations. **All default to `false`** (PRD §8 / D2 — error-forwarding
        by default). Enabling a flag may add latency or mask issues, so they're explicit.
      properties:
        structured_output:
          type: boolean
          default: false
          description: Enforce JSON schema on synthesizer output.
        retry_on_upstream_500:
          type: boolean
          default: false
          description: Retry transient upstream errors once with exponential backoff.

    DeliberationAccepted:
      type: object
      required: [id, status, preset, created_at, stream_url]
      properties:
        id: { type: string }
        status: { type: string, enum: [in_flight] }
        preset: { type: string }
        created_at: { type: string, format: date-time }
        stream_url: { type: string, format: uri }

    DeliberationStatus:
      type: string
      enum: [in_flight, completed, failed, cancelled]

    TerminationReason:
      type: string
      enum: [consensus_reached, max_rounds, confidence_threshold, cancelled, error]

    Deliberation:
      type: object
      required: [id, status, preset, topic, created_at]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/DeliberationStatus' }
        preset: { type: string }
        topic: { type: string }
        context:
          type: [string, 'null']
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        created_at: { type: string, format: date-time }
        completed_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
        total_rounds:
          type: [integer, 'null']
        termination_reason: { $ref: '#/components/schemas/TerminationReason' }
        resolved:
          type: [boolean, 'null']
        residue_score:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: 0 = clean consensus, 1 = maximum unresolved residue.
        split:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Split'
        synthesis:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Synthesis'
        turns:
          type: array
          items: { $ref: '#/components/schemas/Turn' }
        events:
          type: array
          items: { $ref: '#/components/schemas/SystemEvent' }
        cost: { $ref: '#/components/schemas/CostBreakdown' }
        tier_metadata: { $ref: '#/components/schemas/TierMetadata' }

    Split:
      type: object
      description: |
        Present (non-null) only when the panel could not converge. `axis` labels the
        machine-readable disagreement axis; `positions` records each agent's final stance.
      required: [axis, positions]
      properties:
        axis: { type: string }
        positions:
          type: array
          items:
            type: object
            required: [agent, stance]
            properties:
              agent: { type: string }
              stance: { type: string }

    Synthesis:
      type: object
      required: [summary, confidence, consensus]
      properties:
        summary: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        consensus: { type: boolean }
        agreed:
          type: array
          items: { type: string }
        unresolved:
          type: array
          items: { type: string }

    Turn:
      type: object
      required: [round, agent, role, neurotype, model, content]
      properties:
        round: { type: integer, minimum: 0 }
        agent: { type: string }
        role: { type: string }
        neurotype: { type: string }
        model: { type: string }
        content: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/TurnMeta' }

    TurnMeta:
      type: object
      properties:
        provider: { type: string }
        latency_ms: { type: integer, minimum: 0 }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
        upstream_request_id: { type: string }

    SystemEvent:
      type: object
      required: [type, at]
      properties:
        type:
          type: string
          enum: [sentry_alert, osi_threshold, residue_spike, agent_skipped, retry]
        at: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: true

    CostBreakdown:
      type: object
      required: [total_usd, by_provider]
      properties:
        total_usd: { type: number, minimum: 0 }
        by_provider:
          type: object
          additionalProperties:
            type: number
            minimum: 0

    TierMetadata:
      type: object
      properties:
        lineup:
          type: string
          examples: [sandbox, frontier, frontier-closed, custom]
        rate_limit_remaining: { type: integer, minimum: 0 }

    DeliberationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DeliberationListItem' }
        next_cursor:
          type: [string, 'null']
          description: Pass to the next call's `cursor` parameter to paginate.

    DeliberationListItem:
      type: object
      required: [id, preset, topic, status, created_at]
      properties:
        id: { type: string }
        preset: { type: string }
        topic: { type: string }
        status: { $ref: '#/components/schemas/DeliberationStatus' }
        created_at: { type: string, format: date-time }
        completed_at:
          type: [string, 'null']
          format: date-time
        resolved:
          type: [boolean, 'null']
        residue_score:
          type: [number, 'null']
        cost_usd:
          type: [number, 'null']

    CancellationReceipt:
      type: object
      required: [id, status, cancelled_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [cancelled] }
        cancelled_at: { type: string, format: date-time }
        partial_turns: { type: integer, minimum: 0 }
        partial_cost_usd: { type: number, minimum: 0 }

    Usage:
      type: object
      required: [tier, period, deliberations, cost, concurrency]
      properties:
        tier:
          type: string
          enum: [free, pro, team, enterprise, self_host]
        period:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        deliberations:
          type: object
          required: [used]
          properties:
            limit:
              oneOf:
                - { type: integer, minimum: 0 }
                - { type: string, enum: [unlimited] }
            used: { type: integer, minimum: 0 }
            remaining:
              oneOf:
                - { type: integer, minimum: 0 }
                - { type: string, enum: [unlimited] }
        cost: { $ref: '#/components/schemas/CostBreakdown' }
        concurrency:
          type: object
          required: [limit, current]
          properties:
            limit: { type: integer, minimum: 1 }
            current: { type: integer, minimum: 0 }

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version: { type: string }
        upstream_providers:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status:
                type: string
                enum: [ok, degraded, down]
              p99_latency_ms: { type: integer, minimum: 0 }

    StreamTurnEvent:
      allOf:
        - $ref: '#/components/schemas/Turn'
        - type: object
          properties:
            id: { type: string, description: Deliberation ID. }

    StreamSystemEvent:
      $ref: '#/components/schemas/SystemEvent'

    StreamStatusEvent:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/DeliberationStatus' }
        resolved: { type: boolean }
        residue_score: { type: number }
        termination_reason: { $ref: '#/components/schemas/TerminationReason' }

    StreamCostEvent:
      type: object
      required: [total_usd]
      properties:
        total_usd: { type: number, minimum: 0 }
        delta_usd: { type: number, minimum: 0 }

    StreamErrorEvent:
      $ref: '#/components/schemas/Error'

    StreamDoneEvent:
      type: object
      required: [id]
      properties:
        id: { type: string }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - authentication_required
            - authentication_invalid
            - resource_not_found
            - idempotency_conflict
            - concurrency_exceeded
            - invalid_state
            - preset_unavailable
            - rate_limited
            - usage_limit_exceeded
            - internal_error
            - upstream_provider_error
            - service_unavailable
        message: { type: string }
        upstream:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UpstreamErrorContext'
          description: |
            Populated when the error originated from an upstream provider (e.g.,
            OpenRouter). Per PRD D2, this context is preserved verbatim — Parliament
            does not mask, retry, or rewrite upstream errors by default.
        request_id: { type: string }
        documentation_url: { type: string, format: uri }

    UpstreamErrorContext:
      type: object
      required: [provider, status]
      properties:
        provider:
          type: string
          examples: [openrouter, anthropic, openai]
        status: { type: integer, minimum: 100, maximum: 599 }
        body:
          type: string
          description: Raw upstream response body, preserved verbatim.
        request_id: { type: string }

  responses:
    BadRequest:
      description: Validation failure or malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: invalid_request
              message: 'Field `topic` is required and must be 1-2000 characters.'
              request_id: par-req-abc123
              documentation_url: https://docs.parliament.app/errors/invalid_request

    Unauthorized:
      description: Missing or malformed `Authorization` header.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: authentication_required
              message: 'Authorization header is required.'
              request_id: par-req-abc123

    Forbidden:
      description: API key doesn't exist or has been revoked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: authentication_invalid
              message: 'API key is invalid or has been revoked.'
              request_id: par-req-abc123

    NotFound:
      description: Resource not found or not owned by the authenticated account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: resource_not_found
              message: 'Deliberation `del_xxx` not found.'
              request_id: par-req-abc123

    Conflict:
      description: |
        Idempotency conflict (key reused with different body) or concurrency exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            idempotencyConflict:
              value:
                error:
                  code: idempotency_conflict
                  message: 'Idempotency-Key was previously used with a different request body.'
                  request_id: par-req-abc123
            concurrencyExceeded:
              value:
                error:
                  code: concurrency_exceeded
                  message: 'Account is at concurrency limit (1) for tier `pro`.'
                  request_id: par-req-abc123

    UnprocessableEntity:
      description: Preset is unavailable for this account configuration.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: preset_unavailable
              message: 'Preset `adversarial` requires neurotypes [adversary] which are not configured.'
              request_id: par-req-abc123

    RateLimited:
      description: Per-account/IP throttle or usage envelope exhausted.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the client may retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            rateLimited:
              value:
                error:
                  code: rate_limited
                  message: 'Too many requests; retry after 30s.'
                  request_id: par-req-abc123
            usageExceeded:
              value:
                error:
                  code: usage_limit_exceeded
                  message: 'Account has used 350 of 350 deliberations this period.'
                  request_id: par-req-abc123

    InternalError:
      description: Server-side bug.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: internal_error
              message: 'Internal server error; please report this with the request_id.'
              request_id: par-req-abc123

    UpstreamProviderError:
      description: |
        Upstream provider (e.g., OpenRouter) returned an error. The response body
        preserves upstream context verbatim per PRD D2 (error-forwarding by default).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: upstream_provider_error
              message: 'OpenRouter returned 503 Service Unavailable for model anthropic/claude-opus-4-7'
              upstream:
                provider: openrouter
                status: 503
                body: '{"error":{"message":"upstream provider is temporarily unavailable"}}'
                request_id: or-req-abc123
              request_id: par-req-xyz789
              documentation_url: https://docs.parliament.app/errors/upstream_provider_error

    ServiceUnavailable:
      description: Maintenance or capacity-related downtime.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  examples:
    PresetCatalogExample:
      summary: Two-preset catalog
      value:
        presets:
          - id: debate
            name: Debate
            description: The original two-voice deliberation — Proposer opens, Skeptic challenges, Synthesizer reconciles each round.
            best_for: Quick directional decisions where two strong perspectives need airing.
            agent_count: 5
            missing_neurotypes: []
          - id: adversarial
            name: Adversarial Analysis
            description: Failure-mode-first deliberation — the Adversary surfaces what breaks first when this ships.
            best_for: Software-development decisions where the interesting answer is the highest-leverage failure mode.
            agent_count: 5
            missing_neurotypes: []
        default_preset: debate
