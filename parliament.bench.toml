# Tier 1 smoke-test config for PAR-38 Engram memory.
# Uses local Ollama models (fast iteration, no external deps).
# Memory points at locally-running Engram on port 3002.

[parliament]
max_rounds = 2
confidence_threshold = 0.7
red_agent_interval = 99  # suppress RedAgent for the smoke test
osi_enabled = true
osi_threshold = 0.85
server_port = 3000

[context]
provider = "acr"
manifest_path = "/Users/beauxwalton/Dev/ops/phase0"

[memory]
provider = "engram"
endpoint = "http://localhost:3002"
api_key = "eng_kit_local_dev_2026"
# The local dev key is bound to the "bench_agent_local" agent in Engram; the
# server-side identity wins on writes regardless of what we send in the
# query string / x-am-agent-id header. Keeping config and reality aligned
# avoids confusion when reading the persisted records back. See PAR-44 for
# provisioning a dedicated parliament-bench agent + key for multi-tenant
# isolation testing in Tier 2.
agent_id = "bench_agent_local"
recall_limit = 5
layers = ["INSIGHT", "PROJECT"]

[neurotypes.proposer]
model = "qwen3.5:latest"
provider = "ollama"
system_prompt = "You are a structured reasoner. Propose a clear, well-reasoned initial response to the topic. Stay within 200 words. Output plain prose only — no markdown headers, bold, italics, or bullet lists."

# Skeptic and Synthesizer prompts intentionally omitted — PAR-40 ported the
# memory-engagement and memory-continuity clauses into the OSS defaults, so
# the bench config relies on those defaults to validate that the defaults
# themselves drive the right behaviour. Re-add a `system_prompt` here only
# if the bench needs to test a *deviation* from the OSS defaults.
[neurotypes.skeptic]
model = "qwen3.5:latest"
provider = "ollama"

[neurotypes.synthesizer]
model = "qwen3.5:latest"
provider = "ollama"

[neurotypes.redAgent]
model = "qwen3.5:latest"
provider = "ollama"
system_prompt = "You are a disruptor. Inject a challenging perspective that prevents premature consensus. Target the weakest assumption in the current debate. Stay within 200 words. Output plain prose only — no markdown headers, bold, italics, or bullet lists."

[neurotypes.sentry]
model = "qwen3.5:latest"
provider = "ollama"
system_prompt = "You are a monitor. Identify if the current debate shows signs of echo (agents agreeing without genuine synthesis) or uncertainty collapse. Return only: OK, SPECIALIST_NEEDED, or COLLAPSE_DETECTED."
